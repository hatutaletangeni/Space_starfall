<div id="sfmobile-rotate" role="note"><div>↻ Rotate your phone to landscape<small>STARFALL Mobile uses horizontal controls. Turn off portrait orientation lock if rotation is disabled.</small></div></div>
<div id="sfmobile-hud" role="group" aria-label="STARFALL landscape touch controls">
 <div class="sfm-top">
  <button type="button" data-mobile-action="menu" title="Mission console">MENU</button>
  <button type="button" data-mobile-action="engineer" title="Engineer industry controls">ENGINEER</button>
  <button type="button" data-mobile-action="map" title="Star chart">MAP</button>
  <button type="button" data-mobile-action="save" title="Save and restore expedition">SAVE</button>
  <button type="button" data-mobile-action="tools" title="More tools">TOOLS</button>
  <button type="button" data-mobile-action="hide" aria-pressed="false" title="Hide or show touch controls">HIDE</button>
 </div>
 <div class="sfm-left" aria-label="Movement and steering">
  <span class="sfm-spacer"></span><button type="button" class="sfm-hold" data-control="KeyW" aria-label="Hold forward or thrust">▲</button><span class="sfm-spacer"></span>
  <button type="button" class="sfm-hold" data-control="KeyA" aria-label="Hold turn or strafe left">◀</button>
  <button type="button" class="sfm-primary" data-mobile-key="KeyX" title="Board, exit truck, interact" aria-label="Interact board or exit">X</button>
  <button type="button" class="sfm-hold" data-control="KeyD" aria-label="Hold turn or strafe right">▶</button>
  <button type="button" class="sfm-hold" data-control="ShiftLeft" aria-label="Hold sprint or boost">RUN</button>
  <button type="button" class="sfm-hold" data-control="KeyS" aria-label="Hold reverse or brake">▼</button>
  <button type="button" class="sfm-hold" data-control="Space" aria-label="Hold ascend or jump">UP</button>
 </div>
 <div class="sfm-right" aria-label="Flight and action controls">
  <button type="button" data-control="ArrowUp" aria-label="Hold pitch up">P↑</button>
  <button type="button" data-control="ArrowDown" aria-label="Hold pitch down">P↓</button>
  <button type="button" data-control="KeyQ" aria-label="Hold roll left">R◀</button>
  <button type="button" data-control="KeyE" aria-label="Hold roll right">R▶</button>
  <button type="button" class="sfm-primary" data-mobile-key="KeyB" title="Secure or release cargo">CARGO</button>
  <button type="button" class="sfm-primary" data-mobile-key="KeyI" title="Bridge or ship interior">BRIDGE</button>
  <button type="button" data-mobile-key="KeyV" title="Change camera">VIEW</button>
  <button type="button" data-control="KeyC" aria-label="Hold descend">DOWN</button>
  <button type="button" data-mobile-key="KeyT" title="Time acceleration">TIME</button>
  <button type="button" data-mobile-key="KeyG" title="Align to target">ALIGN</button>
  <button type="button" data-mobile-key="KeyL" title="Toggle vehicle lights">LIGHT</button>
  <button type="button" data-mobile-key="KeyF" title="Recenter camera">LOOK</button>
 </div>
 <div class="sfm-caption">Drag space to steer / look · Hold buttons to move · X board / exit</div>
</div>
