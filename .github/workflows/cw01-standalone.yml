name: CW01-CW05 standalone build and checks
on:
  push:
    branches:
      - feature/cw01-celestial-composition
      - feature/cw02-stellar-spectra
      - feature/cw03-mineral-terrain
      - feature/cw04-volatile-phases
      - feature/cw05-atmosphere-optics
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test composition
        run: |
          node --check src/physics/celestial-composition-cw01.js
          node tests/composition-cw01.test.cjs
          node --check src/physics/stellar-spectra-cw02.js
          node tests/stellar-spectra-cw02.test.cjs
          node --check src/terrain/geology-cw03.js
          node tests/mineral-terrain-cw03.test.cjs
          node --check src/physics/volatile-phases-cw04.js
          node tests/volatile-phases-cw04.test.cjs
          node --check src/physics/atmosphere-optics-cw05.js
          node tests/atmosphere-optics-cw05.test.cjs
      - name: Build bundled offline game
        run: python3 tools/build-standalone.py
      - name: Verify single-file parity
        run: python3 tests/standalone-parity.py
      - name: Commit synchronized standalone build
        run: |
          if ! git diff --quiet -- PLAY-STARFALL.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PLAY-STARFALL.html
            git commit -m "build(CW01-CW05): synchronize standalone offline HTML"
            git push
          fi
