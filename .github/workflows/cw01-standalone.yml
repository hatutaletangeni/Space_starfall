name: CW01 standalone build and checks
on:
  push:
    branches:
      - feature/cw01-celestial-composition
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test composition
        run: |
          node --check src/physics/celestial-composition-cw01.js
          node tests/composition-cw01.test.cjs
      - name: Build bundled offline game
        run: python3 tools/build-standalone.py
      - name: Verify single-file parity
        run: python3 tests/standalone-parity.py
      - name: Commit synchronized standalone build
        run: |
          if ! git diff --quiet -- PLAY-STARFALL.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PLAY-STARFALL.html
            git commit -m "build(CW01): synchronize standalone offline HTML"
            git push
          fi
