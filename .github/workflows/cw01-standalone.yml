name: CW01-CW06 + LW01-LW05 standalone build and checks
on:
  push:
    branches:
      - feature/cw01-celestial-composition
      - feature/cw02-stellar-spectra
      - feature/cw03-mineral-terrain
      - feature/cw04-volatile-phases
      - feature/cw05-atmosphere-optics
      - feature/cw06-science-integration-release
      - feature/lw01-geothermal-causality
      - feature/lw02-mountains-caves
      - feature/lw03-causal-meteorology
      - feature/lw04-hydrosphere-buoyancy
      - feature/lw05-physical-asteroids-rings
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test composition
        run: |
          node --check src/physics/celestial-composition-cw01.js
          node tests/composition-cw01.test.cjs
          node --check src/physics/stellar-spectra-cw02.js
          node tests/stellar-spectra-cw02.test.cjs
          node --check src/terrain/geology-cw03.js
          node tests/mineral-terrain-cw03.test.cjs
          node --check src/physics/volatile-phases-cw04.js
          node tests/volatile-phases-cw04.test.cjs
          node --check src/physics/atmosphere-optics-cw05.js
          node tests/atmosphere-optics-cw05.test.cjs
          node tests/composition-integration-cw06.test.cjs
          node --check src/physics/geothermal-lw01.js
          node tests/geothermal-lw01.test.cjs
          node tests/geothermal-events-lw01.test.cjs
          node --check src/terrain/living-geology-lw02.js
          node --check src/terrain/cave-mesh-lw02.js
          node --check src/archaeology/interiors-ui.js
          node --check src/physics/observatory.js
          node --check src/flight.js
          node --check src/engine.js
          node tests/living-geology-lw02.test.cjs
          node --check src/physics/meteorology-lw03.js
          node --check src/physics/science-field.js
          node --check src/events/events.js
          node --check src/events/events-ui.js
          node --check src/flight.js
          node --check src/engine.js
          node tests/meteorology-lw03.test.cjs
          node --check src/physics/hydrosphere-lw04.js
          node --check src/terrain/water-mesh-lw04.js
          node --check src/engine.js
          node --check src/flight.js
          node --check src/physics/observatory.js
          node tests/hydrosphere-lw04.test.cjs
          node --check src/physics/debris-lw05.js
          node --check src/physics/operations-ui-t16.js
          node --check src/engine.js
          node --check src/flight.js
          node tests/debris-lw05.test.cjs
          node tests/asset-explorer-no-operations-lw05.test.cjs
          node --check src/engine.js
          node --check src/flight.js
          node --check src/events/events.js
          node --check src/events/events-ui.js
          node --check src/physics/science-field.js
          node --check src/physics/observatory.js
      - name: Build bundled offline game
        run: python3 tools/build-standalone.py
      - name: Verify single-file parity
        run: python3 tests/standalone-parity.py
      - name: Commit synchronized standalone build
        run: |
          if ! git diff --quiet -- PLAY-STARFALL.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PLAY-STARFALL.html
            git commit -m "build(LW05): synchronize standalone offline HTML"
            git push
          fi
