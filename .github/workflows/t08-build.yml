name: T08 regenerate standalone (temporary)
on:
  push:
    branches: [feature/t08-interplanetary-comms]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build exact standalone
        run: |
          python tools/build-standalone.py
          python tests/standalone-parity.py
      - name: Commit generated output
        run: |
          if ! git diff --quiet -- PLAY-STARFALL.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PLAY-STARFALL.html
            git commit -m "build(t08): regenerate offline space comms from editable modules"
            git push origin HEAD:feature/t08-interplanetary-comms
          fi
