name: Starfall Engineering Regression

on:
  push:
    branches: [main, "release/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: JavaScript syntax of every editable source
        shell: bash
        run: |
          set -eu
          find src -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: All Node model and regression suites
        shell: bash
        run: |
          set -eu
          for test in tests/*.test.cjs; do
            echo "RUN $test"
            node "$test"
          done
      - name: Strict offline standalone parity
        run: python tests/standalone-parity.py
      - name: Rebuild desktop and mobile standalones and verify both tracked builds
        run: |
          python tools/build-standalone.py
          python tools/build-mobile-standalone.py
          python tests/standalone-parity.py
          python tests/mobile-standalone-parity.py
          git diff --exit-code -- PLAY-STARFALL.html PLAY-STARFALL-MOBILE.html

  browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      # Historical-save browser regression reads genuine previous commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test-only Playwright + Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Exercise every STARFALL browser test in headless Chromium (shard ${{ matrix.shard }})
        run: |
          shard=${{ matrix.shard }}
          index=0
          count=0
          failed=0
          for test in tests/*-browser.py; do
            if [ $((index % 6)) -eq "$shard" ]; then
              count=$((count + 1))
              echo "::group::Browser test: $test"
              python "$test" || failed=$((failed + 1))
              echo "::endgroup::"
            fi
            index=$((index + 1))
          done
          echo "Shard $shard: ran $count of $index browser tests; failed $failed"
          test "$count" -gt 0
          test "$failed" -eq 0
      - name: Upload actual software-WebGL screenshot and performance data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starfall-7f-software-webgl-qa-shard-${{ matrix.shard }}
          path: artifacts/7f-expedition-ci/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload real remote-camera WebGL readback for visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starfall-t05-remote-camera-actual-webgl-shard-${{ matrix.shard }}
          path: artifacts/t05-camera-evidence/
          if-no-files-found: ignore
          retention-days: 14
