name: STARFALL 8H clean source-owned conveyor trays
on:
  push:
    branches:
      - feature/update-8h-tray-from-current-main
  pull_request:
    paths:
      - 'src/physics/industrial-site8e.js'
      - 'tests/conveyor-bounded-trays8h.test.cjs'
      - '.github/workflows/update-8h-tray-current-main.yml'
jobs:
  certified-empty-tray:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-owned 40 kg tray and existing game invariants
        run: |
          set -euo pipefail
          node --check src/physics/industrial-site8e.js
          node --test tests/conveyor-bounded-trays8h.test.cjs
          node --test tests/logistics-conveyor-fabrication8h.test.cjs
          node --test tests/conveyor-power-port8h.test.cjs
          node --test tests/logistics-powered-network8h.test.cjs
          node tests/technology-contracts.test.cjs
          python3 tests/standalone-parity.py
