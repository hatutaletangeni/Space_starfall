name: STARFALL 8I paid 8G pressure-shell to T09 browser acceptance
on:
  push:
    branches:
      - fix/update8-release-gates-20261107
    paths:
      - src/physics/habitat-commission8i.js
      - src/physics/habitat-commission-ui8i.js
      - src/physics/outposts.js
      - src/physics/outposts-ui.js
      - src/flight.js
      - tests/habitat-commission8i.test.cjs
      - tests/habitat-hose8g-browser.py
      - index.html
      - PLAY-STARFALL.html
      - PLAY-STARFALL-MOBILE.html
      - .github/workflows/update-8i-paid-habitat-commission.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paid-habitat-source-and-real-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test native 8G-to-T09 ownership and duplicate/phantom-supply rejection
        run: |
          node --check src/physics/habitat-commission8i.js
          node --check src/physics/habitat-commission-ui8i.js
          node --check src/flight.js
          node tests/habitat-commission8i.test.cjs
          node tests/industrial-t09-no-free-supplies8k.test.cjs
      - name: Build actual desktop and mobile offline game with strict parity
        run: |
          python tools/build-standalone.py
          python tools/build-mobile-standalone.py
          python tests/standalone-parity.py
          python tests/mobile-standalone-parity.py
      - name: Install test-only real Chromium WebGL2
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Paid 8G structural stage and rated hose become one persisted T09 habitat
        run: python tests/habitat-hose8g-browser.py
