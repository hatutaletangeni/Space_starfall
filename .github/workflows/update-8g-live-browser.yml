name: STARFALL 8G live assembly browser
on:
  push:
    branches:
      - feature/update-8g-live-assembly-runtime
      - release/update-8g-hardware-clearance-current-main
      - feature/update-8g-manufactured-frame-transport
  pull_request:
    paths:
      - 'src/physics/*8g.js'
      - 'src/flight.js'
      - 'src/engine.js'
      - 'src/physics/outposts-ui.js'
      - 'index.html'
      - 'PLAY-STARFALL.html'
      - 'tests/assembly-live8g-browser.py'
      - '.github/workflows/update-8g-live-browser.yml'
jobs:
  live-assembly-and-reload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline Chromium harness
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Build editable source into a standalone and run actual WebGL2 assembly interaction
        run: |
          python3 tools/build-standalone.py
          python3 tests/standalone-parity.py
          python3 tests/assembly-live8g-browser.py
