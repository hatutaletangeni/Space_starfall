name: T15 Targeted Equipment Workbench Browser Contract

on:
  push:
    branches: [feature/t15-asset-manager-real-configs]
    paths-ignore:
      - PLAY-STARFALL.html

permissions:
  contents: read

concurrency:
  group: t15-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  science-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify installed parts, power/traction, provenance and real rollback
        run: node tests/equipment-t15.test.cjs
      - name: Build exact latest offline game and verify model-to-bundle parity
        run: |
          python tools/build-standalone.py
          python tests/standalone-parity.py
      - name: Install isolated Chromium software WebGL test runner
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify original Workbench changes real installed hardware and reload
        run: python tests/equipment-t15-browser.py
