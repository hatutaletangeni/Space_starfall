name: T05 regenerate standalone (temporary)
on:
  push:
    branches: [feature/t05-remote-world-imaging]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Rebuild and check exact standalone
        run: |
          python tools/build-standalone.py
          python tests/standalone-parity.py
      - name: Commit generated offline version
        run: |
          if ! git diff --quiet -- PLAY-STARFALL.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PLAY-STARFALL.html
            git commit -m "build(t05): synchronize offline browser game with isolated remote imaging"
            git push origin HEAD:feature/t05-remote-world-imaging
          fi
