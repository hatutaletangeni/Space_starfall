name: STARFALL 8G finite atmospheric nitrogen browser
on:
  push:
    branches:
      - feature/update-8g-finite-nitrogen-air-fractionation
      - feature/update-8g-rated-gas-vessel-ship-cargo
  pull_request:
    paths:
      - 'src/physics/air-fractionation8g.js'
      - 'src/physics/gas-vessel-cargo8g.js'
      - 'src/physics/gas-vessel-cargo-ui8g.js'
      - 'tests/gas-vessel-cargo8g.test.cjs'
      - 'src/physics/air-fractionation-ui8g.js'
      - 'src/physics/kit-recipes8f.js'
      - 'src/physics/industrial-site8e.js'
      - 'src/flight.js'
      - 'index.html'
      - 'PLAY-STARFALL.html'
      - 'tests/air-fractionation8g*'
      - '.github/workflows/update-8g-nitrogen-browser.yml'
jobs:
  real-nitrogen-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real offline Chromium/WebGL harness
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test finite atmospheric source, physical nitrogen tank and game UI
        run: |
          node --check src/physics/air-fractionation8g.js
          node --check src/physics/air-fractionation-ui8g.js
          node tests/air-fractionation8g.test.cjs
          node tests/gas-vessel-cargo8g.test.cjs
          python3 tools/build-standalone.py
          python3 tests/standalone-parity.py
          python3 tests/air-fractionation8g-browser.py
