name: STARFALL 9F Biome-wide Wildlife Release
on:
  push:
    branches:
      - feature/9f-streamed-biome-wildlife
  pull_request:
    paths:
      - 'src/ecology/**'
      - 'index.html'
      - 'PLAY-STARFALL.html'
      - 'PLAY-STARFALL-MOBILE.html'
      - 'tests/ecology9f*'
      - '.github/workflows/ecology9f-release.yml'
  workflow_dispatch:
jobs:
  streamed-wildlife-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 9F source validation and historical ecology regressions
        run: |
          node --check src/ecology/biome-wildlife9f.js
          node --check src/ecology/ecology-ui.js
          node tests/ecology9f.test.cjs
          node tests/ecology9f-scene.test.cjs
          node tests/ecology9e.test.cjs
          node tests/ecology9d.test.cjs
          node tests/ecology9d-scene.test.cjs
          node tests/living-biosphere.test.cjs
          node tests/aerodynamics9c.test.cjs
      - name: Rebuild both desktop and mobile offline standalone files
        run: |
          python tools/build-standalone.py
          python tools/build-mobile-standalone.py
          python tests/standalone-parity.py
          python tests/mobile-standalone-parity.py
      - name: Install Chromium software WebGL2
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Regression against live WebGL2 fauna and 9C flight
        run: |
          python tests/ecology9b-browser.py
          python tests/aerodynamics9c-browser.py
          python tests/ecology9d-browser.py
      - name: Save desktop/mobile wildlife graphics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starfall-9f-biome-fauna-webgl
          path: |
            artifacts/ecology9b/
            artifacts/ecology9c/
            artifacts/ecology9d/
          if-no-files-found: warn
          retention-days: 14
      - name: Synchronize committed desktop and mobile standalone games
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/9f-streamed-biome-wildlife'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PLAY-STARFALL.html PLAY-STARFALL-MOBILE.html
          if ! git diff --cached --quiet; then
            git commit -m "build(9F): synchronize biome-wide wildlife desktop/mobile standalones"
            git push origin HEAD:feature/9f-streamed-biome-wildlife
          fi
