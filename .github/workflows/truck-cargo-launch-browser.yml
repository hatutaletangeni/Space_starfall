name: STARFALL secured-truck Rocket Lab browser regression
on:
  push:
    branches:
      - hotfix/truck-cargo-status-launch-dialog
  pull_request:
    branches:
      - main
    paths:
      - 'src/flight.js'
      - 'src/physics/launch-ui.js'
      - 'tests/expedition-hardening-browser.py'
      - 'PLAY-STARFALL.html'
      - '.github/workflows/truck-cargo-launch-browser.yml'
permissions:
  contents: read
jobs:
  rocket-lab-and-cargo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify bundled source and cargo model
        run: |
          python tests/standalone-parity.py
          node tests/cargo-bay8b.test.cjs
          node tests/update8a.test.cjs
      - name: Install Chromium with software WebGL2
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify actual Rocket Lab opens with truck secured aboard
        run: python tests/expedition-hardening-browser.py
      - name: Preserve real browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truck-cargo-launch-browser-evidence
          path: artifacts/7f-expedition-ci/
          if-no-files-found: ignore
