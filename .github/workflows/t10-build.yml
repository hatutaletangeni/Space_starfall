name: T10 standalone rebuild (temporary)
on:
  push:
    branches: [feature/t10-science-chain-custody]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate exact single-file game
        run: |
          python tools/build-standalone.py
          python tests/standalone-parity.py
      - name: Commit exact output
        run: |
          if ! git diff --quiet -- PLAY-STARFALL.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PLAY-STARFALL.html
            git commit -m "build(t10): regenerate offline bundle from authoritative science modules"
            git push origin HEAD:feature/t10-science-chain-custody
          fi
