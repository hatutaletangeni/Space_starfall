name: STARFALL T01 physical satellite reload energy acceptance
on:
  push:
    branches: [fix/t01-satellite-physically-bounded-reload-20261109]
    paths:
      - tests/mission-operations-t01-browser.py
      - .github/workflows/t01-solar-reload-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-offworld-energy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Rebuild both offline playables without changing source
        run: |
          python tools/build-standalone.py
          python tools/build-mobile-standalone.py
          python tests/standalone-parity.py
          python tests/mobile-standalone-parity.py
      - name: Install real headless WebGL2 Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Confirm actual orbital solar watt-seconds and source-owned battery after reload
        run: python tests/mission-operations-t01-browser.py
