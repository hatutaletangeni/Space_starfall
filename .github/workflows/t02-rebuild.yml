name: T02 regenerate standalone (temporary)
on:
  push:
    branches: [feature/t02-unified-electrical-power]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and verify offline game
        run: |
          python tools/build-standalone.py
          python tests/standalone-parity.py
      - name: Commit exact generated output
        run: |
          if ! git diff --quiet -- PLAY-STARFALL.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PLAY-STARFALL.html
            git commit -m "build(t02): regenerate standalone game from editable modules"
            git push origin HEAD:feature/t02-unified-electrical-power
          fi
