name: T10 focused lab/browser (temporary)
on:
  push:
    branches: [feature/t10-science-chain-custody]
jobs:
  laboratory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and verify source contract
        run: |
          python tools/build-standalone.py
          python tests/standalone-parity.py
          node tests/science-chain-t10.test.cjs
      - name: Install actual Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run focused 7D specimen/lab evidence
        run: python tests/science-chain-t10-browser.py
