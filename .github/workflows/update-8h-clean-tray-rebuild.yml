name: STARFALL 8H clean tray offline rebuilder
on:
  push:
    branches:
      - feature/update-8h-tray-from-current-main
permissions:
  contents: write
jobs:
  rebuild-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate identical shipped standalone, never alter main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 tools/build-standalone.py
          python3 tests/standalone-parity.py
          if ! git diff --quiet -- PLAY-STARFALL.html; then
            git add PLAY-STARFALL.html
            git commit -m 'build(8H): sync installed source-owned conveyor tray to standalone'
            git push origin HEAD:feature/update-8h-tray-from-current-main
          fi
