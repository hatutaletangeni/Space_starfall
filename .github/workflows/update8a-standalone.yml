name: Update 8D powered mining and hauling
on:
  push:
    branches:
      - feature/update-8d-mining-hauling
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-and-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check inventory scripts
        run: |
          node --check src/physics/physical-inventory8a.js
          node --check src/physics/material-ledger8a.js
          node --check src/physics/physical-inventory-ui8a.js
          node --check src/physics/cargo-bay8b.js
          node --check src/physics/planetary-resources8c.js
          node --check src/physics/planetary-resources-ui8c.js
          node --check src/physics/modular-ship8e.js
          node --check src/physics/ship-walk8e.js
          node --check src/physics/modular-ship-ui8e.js
          node --check src/physics/life-support8e.js
          node --check src/physics/mining-hauling8d.js
          node --check src/physics/mining-hauling-ui8d.js
          node --check src/physics/power.js
          node --check src/engine.js
          node --check src/controls/input.js
          node --check src/flight.js
          node tests/update8a.test.cjs
          node tests/material-ledger8a.test.cjs
          node tests/cargo-bay8b.test.cjs
          node tests/planetary-resources8c.test.cjs
          node tests/modular-ship8e.test.cjs
          node tests/life-support8e.test.cjs
          node tests/mining-hauling8d.test.cjs
      - name: Rebuild source-synchronized standalone
        run: |
          python tools/build-standalone.py
          python tests/standalone-parity.py
      - name: Preserve standalone on the feature branch
        run: |
          if ! git diff --quiet -- PLAY-STARFALL.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PLAY-STARFALL.html
            git commit -m "8D: synchronize offline standalone with physical inventory"
            git push origin HEAD:feature/update-8d-mining-hauling
          fi
      - name: Archive standalone validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: starfall-8d-standalone
          path: PLAY-STARFALL.html
          if-no-files-found: error

  ship-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser QA dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify real 8E renderer and module UI
        run: |
          python tests/modular-ship8e-browser.py
          python tests/mining-hauling8d-browser.py
          python tests/modular-ship8e-walk-browser.py
      - name: Upload software-WebGL screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starfall-8d-mining-real-browser
          path: |
            artifacts/8e-ship-chromium/
            artifacts/8d-mining-chromium/
          if-no-files-found: ignore
