name: STARFALL manufactured launch regenerative habitat and atmospheric capture
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-owners-and-native-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          node tests/industry-completion8k.test.cjs
          node tests/orbital-baseline-climate8k.test.cjs
          node tests/climate-benchmarks8j.test.cjs
          node tools/validate-climate8j.cjs artifacts/climate-validation
          node tests/industrial-launch-no-free-rocket8k.test.cjs
          node tests/habitat-t09.test.cjs
          python tools/build-standalone.py
          python tools/build-mobile-standalone.py
          python tests/standalone-parity.py
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: |
          python tests/industry-completion8k-browser.py
          python tests/orbital-propulsion8k-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: industry-completion-native-ui
          path: |
            artifacts/industry-completion/
            artifacts/climate-validation/
