name: STARFALL 8H original chemical 80L gas output native T02 pipe transit
on:
  push:
    branches:
      - feature/update-8h-real-chemical-product-gas-transit
      - feature/update-8h-no-unrouted-chemical-gas
  pull_request:
    paths:
      - 'src/physics/chemical-gas-output8h.js'
      - 'src/physics/industrial-plant8e.js'
      - 'src/physics/industrial-site-ui8e.js'
      - 'src/physics/outposts-ui.js'
      - 'src/flight.js'
      - 'index.html'
      - 'PLAY-STARFALL.html'
      - 'tests/chemical-gas-output8h*'
      - '.github/workflows/update-8h-chemical-gas-output.yml'
permissions:
  contents: write
jobs:
  rebuild-original-play:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build identical existing original STARFALL source into offline PLAY
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 tools/build-standalone.py
          python3 tests/standalone-parity.py
          if ! git diff --quiet -- PLAY-STARFALL.html; then
            git add PLAY-STARFALL.html
            git commit -m 'build(8H): original source-owned chemical output pipe transit standalone parity'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
  actual-original-8a-80l-t02-gas:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Actual signed 8E source chemistry → finite original 8A 80L pipe → native 420W/10s paid output
        run: |
          set -euo pipefail
          node --check src/physics/chemical-gas-output8h.js
          node --check src/physics/industrial-plant8e.js
          node --check src/physics/outposts-ui.js
          node --check src/flight.js
          node --check src/physics/industrial-site-ui8e.js
          node --test tests/chemical-gas-output8h.test.cjs
          node --test tests/industrial-chemistry8e.test.cjs
          node --test tests/industrial-gas-manifold8h.test.cjs
          node --test tests/pressure-gas-packets8h.test.cjs
          node --test tests/active-native-substeps8h.test.cjs
          node --test tests/lossy-tailings-recycling8h.test.cjs
          node --test tests/industry-crosschain8e-8f.test.cjs
          python3 -m py_compile tests/chemical-gas-output8h-browser.py
          python3 tests/standalone-parity.py
      - name: Install original offline Chromium software WebGL2 harness
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Real original source-owned player Engineer and physical ship/truck save smoke
        run: |
          python3 tests/chemical-gas-output8h-browser.py
          python3 tests/industrial-gas-manifold8h-browser.py
          python3 tests/pressure-pipe-live8h-browser.py
          python3 tests/active-native-substeps8h-browser.py
