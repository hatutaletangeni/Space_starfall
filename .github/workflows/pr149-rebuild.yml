name: One-time rebuild of PR149 offline playables
on:
  push:
    branches: [feat/8h-physical-plant-output-conveyor-20261110]
    paths: ['.github/workflows/pr149-rebuild.yml']
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild original offline HTML without modifying source
        run: |
          python tools/build-standalone.py
          python tools/build-mobile-standalone.py
          python tests/standalone-parity.py
      - name: Commit only source-matched desktop/mobile playables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- PLAY-STARFALL.html PLAY-STARFALL-MOBILE.html
          if ! git diff --cached --quiet; then
            git commit -m "build(8H): synchronize both offline playables with physical plant-output route"
            git push origin HEAD:feat/8h-physical-plant-output-conveyor-20261110
          fi
