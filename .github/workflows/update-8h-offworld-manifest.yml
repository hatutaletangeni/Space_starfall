name: STARFALL 8H original ship offworld finite cargo manifest
on:
  push:
    branches:
      - feature/update-8h-real-offworld-ship-manifest
  pull_request:
    paths:
      - 'src/physics/logistics-offworld-manifest8h.js'
      - 'tests/logistics-offworld-manifest8h.test.cjs'
      - '.github/workflows/update-8h-offworld-manifest.yml'
jobs:
  original-ship-cargo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original 8D ship cargo mass, reserved offworld capacity, real launch and paid EVA delivery
        run: |
          set -euo pipefail
          node --check src/physics/logistics-offworld-manifest8h.js
          node --test tests/logistics-offworld-manifest8h.test.cjs
          node --test tests/logistics-orders8h.test.cjs
          node --test tests/logistics-energy8h.test.js
          node --test tests/logistics-battery-bridge8h.test.cjs
          node --test tests/material-ledger8a.test.cjs
      - name: Preserve offline original ship and game bundle parity
        run: python3 tests/standalone-parity.py
