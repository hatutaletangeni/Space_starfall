name: STARFALL 9E Live Organisms Regression
on:
  push:
    branches:
      - feature/9e-living-ecosystem-behaviors
  pull_request:
    paths:
      - 'src/ecology/**'
      - 'src/engine.js'
      - 'index.html'
      - 'tests/ecology9e*'
      - 'PLAY-STARFALL.html'
      - 'PLAY-STARFALL-MOBILE.html'
      - '.github/workflows/ecology9e-release.yml'
  workflow_dispatch:
jobs:
  verify-live-ecosystems:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: All existing ecology modules and 9E obstacle regression
        run: |
          node --check src/ecology/locomotion9d.js
          node --check src/ecology/ecology-ui.js
          node --check src/engine.js
          node tests/living-biosphere.test.cjs
          node tests/aerodynamics9c.test.cjs
          node tests/ecology9d.test.cjs
          node tests/ecology9d-scene.test.cjs
          node tests/ecology9e.test.cjs
      - name: Build desktop and landscape mobile standalones with parity
        run: |
          python tools/build-standalone.py
          python tools/build-mobile-standalone.py
          python tests/standalone-parity.py
          python tests/mobile-standalone-parity.py
      - name: Install Chromium software WebGL2 harness
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Visual regression on both editions, skin/organs/wing motion
        run: |
          python tests/ecology9b-browser.py
          python tests/aerodynamics9c-browser.py
          python tests/ecology9d-browser.py
      - name: Archive genuine GPU software-render screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecology-9e-four-sail-living-fauna
          path: |
            artifacts/ecology9b/
            artifacts/ecology9c/
            artifacts/ecology9d/
          if-no-files-found: warn
          retention-days: 14
      - name: Commit generated standalone files to 9E feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/9e-living-ecosystem-behaviors'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PLAY-STARFALL.html PLAY-STARFALL-MOBILE.html
          if ! git diff --cached --quiet; then
            git commit -m "build(9E): synchronize enhanced desktop and mobile organism meshes"
            git push origin HEAD:feature/9e-living-ecosystem-behaviors
          fi
