name: STARFALL 8K full expedition evidence gates
# A release gate must run for every PR; a narrow path filter previously hid
# mining, logistics, habitat and planetary changes from 8K coverage.
on:
  push:
    branches: [main, fix/8k-acceptance-gates-20261109]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-and-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check read-only evidence model and original game
        run: |
          node --check src/physics/expedition-audit8k.js
          node --check src/physics/expedition-audit-ui8k.js
          node --check src/flight.js
          node tests/expedition-audit8k.test.cjs
          node tests/update8k-time-acceleration.test.cjs
          node tests/terraform-numeric-safety8j.test.cjs
      - name: Exercise physical ore, refinery, factory and electrical model contracts
        run: |
          node tests/planetary-resources8c.test.cjs
          node tests/mining-hauling8d.test.cjs
          node tests/refinery8e.test.cjs
          node tests/iron-steel-chain8e.test.cjs
          node tests/copper-sulfide-chain8e.test.cjs
          node tests/industry-crosschain8e-8f.test.cjs
          node tests/pre8k-real8f-to-t02-chain.test.cjs
          node tests/update8k-natural-copper-to-wire.test.cjs
          node tests/update8k-powered-habitat-chain.test.cjs
          node tests/t02-paid-grid8i.test.cjs
          node tests/industrial-t09-no-free-supplies8k.test.cjs
          node tests/habitat-oxygen8i.test.cjs
          node tests/habitat-scrubber8i.test.cjs
          node tests/habitat-supply8i.test.cjs
          node tests/atmosphere-emission8j.test.cjs
          node tests/logistics-offworld-manifest8h.test.cjs
          node tests/industrial-solar-no-free-generation8k.test.cjs
          node tests/industrial-battery-no-free-charge8k.test.cjs
      - name: Rebuild real offline playables and compare source-owned embeds
        run: |
          python tools/build-standalone.py
          python tools/build-mobile-standalone.py
          python tests/standalone-parity.py
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify read-only physical expedition report in real Chromium
        run: |
          python tests/expedition-audit8k-browser.py
          python tests/mining-hauling8d-browser.py
          python tests/t02-paid-install8i-browser.py
          python tests/terraform-feasibility8j-browser.py
          python tests/atmosphere-emission8j-browser.py

