name: STARFALL 8H genuine 8A source-owned lossy Fe and Cu recycling
on:
  push:
    branches:
      - feature/update-8h-real-lossy-tailings-recovery
  pull_request:
    paths:
      - 'src/physics/refinery8e.js'
      - 'src/physics/refinery-ui8e.js'
      - 'src/flight.js'
      - 'PLAY-STARFALL.html'
      - 'tests/refinery8e.test.cjs'
      - 'tests/lossy-tailings-recycling8h*'
      - '.github/workflows/update-8h-lossy-recycling.yml'
permissions:
  contents: write
jobs:
  rebuild-original-standalone:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: No new game; exact source-owned offline playable build
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 tools/build-standalone.py
          python3 tests/standalone-parity.py
          if ! git diff --quiet -- PLAY-STARFALL.html; then
            git add PLAY-STARFALL.html
            git commit -m 'build(8H): original source-owned lossy tailings recycling standalone parity'
            git push origin HEAD:feature/update-8h-real-lossy-tailings-recovery
          fi
  proof-no-recycled-free-matter:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Original 8E/8F + 8H physical recycling proof, no negative or duplicate material
        run: |
          set -euo pipefail
          node --check src/flight.js
          node --check src/physics/refinery8e.js
          node --check src/physics/refinery-ui8e.js
          node --test tests/refinery8e.test.cjs
          node --test tests/lossy-tailings-recycling8h.test.cjs
          node --test tests/industry-crosschain8e-8f.test.cjs
          node --test tests/iron-steel-chain8e.test.cjs
          node --test tests/copper-sulfide-chain8e.test.cjs
          node --test tests/pressure-gas-packets8h.test.cjs
          python3 -m py_compile tests/lossy-tailings-recycling8h-browser.py
          python3 tests/standalone-parity.py
      - name: Install original Chromium (software WebGL2, not physical GPU benchmark)
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Real original offline Engineer NO-free-waste recycling and regression
        run: |
          python3 tests/lossy-tailings-recycling8h-browser.py
          python3 tests/industry-flow-inspector8h-browser.py
          python3 tests/mining-hauling8d-browser.py
