name: STARFALL 8H real T02-powered timed conveyor packets
on:
  push:
    branches:
      - feature/update-8h-metered-conveyor-packets
  pull_request:
    paths:
      - 'src/physics/conveyor-packets8h.js'
      - 'tests/conveyor-packets8h.test.cjs'
      - '.github/workflows/update-8h-metered-conveyor.yml'
jobs:
  original-mass-and-metered-t02:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One-hop physical packets with actual T02 grid Joules and original 8A custody
        run: |
          set -euo pipefail
          node --check src/physics/conveyor-packets8h.js
          node --test tests/conveyor-packets8h.test.cjs
          node --test tests/conveyor-bounded-trays8h.test.cjs
          node --test tests/conveyor-power-port8h.test.cjs
          node --test tests/logistics-powered-network8h.test.cjs
          node --test tests/power-ledger-t02.test.cjs
          node --test tests/material-ledger8a.test.cjs
      - name: Original standalone source parity
        run: python3 tests/standalone-parity.py
