name: STARFALL 8H live source-owned offworld ship UI and durable voyage
on:
  push:
    branches:
      - feature/update-8h-live-offworld-manifests
  pull_request:
    paths:
      - 'src/flight.js'
      - 'src/physics/logistics-offworld-*.js'
      - 'index.html'
      - 'PLAY-STARFALL.html'
      - 'tests/logistics-offworld-*.py'
      - 'tests/logistics-offworld-*.cjs'
      - '.github/workflows/update-8h-live-offworld.yml'
permissions:
  contents: write
jobs:
  rebuild-standalone:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rebuild source-identical original offline game only on this feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 tools/build-standalone.py
          python3 tests/standalone-parity.py
          if ! git diff --quiet -- PLAY-STARFALL.html; then
            git add PLAY-STARFALL.html
            git commit -m 'build(8H): original-ship offworld UI and persistent manifest standalone parity'
            git push origin HEAD:feature/update-8h-live-offworld-manifests
          fi
  real-browser-offworld:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Native cargo owner model, flight source checks and standalone integrity
        run: |
          set -euo pipefail
          node --check src/flight.js
          node --check src/physics/logistics-offworld-manifest8h.js
          node --check src/physics/logistics-offworld-ui8h.js
          node --test tests/logistics-offworld-live8h.test.cjs
          node --test tests/logistics-offworld-manifest8h.test.cjs
          node --test tests/logistics-battery-bridge8h.test.cjs
          node --test tests/material-ledger8a.test.cjs
          python3 -m py_compile tests/logistics-offworld-live8h-browser.py
          python3 tests/standalone-parity.py
      - name: Install actual software WebGL2 browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Exercise real Engineer UI, no free cargo, and legacy original flight regressions
        run: |
          python3 tests/logistics-offworld-live8h-browser.py
          python3 tests/logistics-ui8h-browser.py
          python3 tests/mining-hauling8d-browser.py
