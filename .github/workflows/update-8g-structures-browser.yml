name: STARFALL 8G rocket and habitat physical assembly browser
on:
  push:
    branches:
      - feature/update-8g-rocket-habitat-industrial-assembly
      - release/update-8g-structure-repairs-current-main
  pull_request:
    paths:
      - 'src/physics/structure-assembly8g.js'
      - 'src/physics/structure-assembly-ui8g.js'
      - 'src/physics/kit-recipes8f.js'
      - 'src/physics/stock-parts8f.js'
      - 'src/physics/industrial-site8e.js'
      - 'src/physics/assembly8g.js'
      - 'src/flight.js'
      - 'index.html'
      - 'PLAY-STARFALL.html'
      - 'tests/structure-assembly8g*'
      - '.github/workflows/update-8g-structures-browser.yml'
jobs:
  physical-rocket-and-habitat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline WebGL Chromium test harness
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test physical paid rocket and habitat construction in real offline game
        run: |
          node --check src/physics/structure-assembly8g.js
          node --check src/physics/structure-assembly-ui8g.js
          node tests/structure-assembly8g.test.cjs
          python3 tools/build-standalone.py
          python3 tests/standalone-parity.py
          python3 tests/structure-assembly8g-browser.py
