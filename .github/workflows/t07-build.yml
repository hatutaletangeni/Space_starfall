name: T07 regenerate standalone (temporary)
on:
  push:
    branches: [feature/t07-operational-satellite-bus]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build exact self-contained STARFALL
        run: |
          python tools/build-standalone.py
          python tests/standalone-parity.py
      - name: Commit the generated file
        run: |
          if ! git diff --quiet -- PLAY-STARFALL.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PLAY-STARFALL.html
            git commit -m "build(t07): regenerate standalone from original satellite bus sources"
            git push origin HEAD:feature/t07-operational-satellite-bus
          fi
