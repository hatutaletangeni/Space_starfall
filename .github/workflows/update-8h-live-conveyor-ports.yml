name: STARFALL 8H live certified conveyor T02 port installation and wiring
on:
  push:
    branches:
      - feature/update-8h-live-conveyor-electric-ports
  pull_request:
    paths:
      - 'src/flight.js'
      - 'src/physics/logistics-conveyor-live-ui8h.js'
      - 'src/physics/conveyor-power-port8h.js'
      - 'index.html'
      - 'PLAY-STARFALL.html'
      - 'tests/conveyor-live-port8h*'
      - '.github/workflows/update-8h-live-conveyor-ports.yml'
permissions:
  contents: write
jobs:
  rebuild-exact-standalone:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rebuild original offline playable source without changing ship/truck
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 tools/build-standalone.py
          python3 tests/standalone-parity.py
          if ! git diff --quiet -- PLAY-STARFALL.html; then
            git add PLAY-STARFALL.html
            git commit -m 'build(8H): original offline gameplay exact certified conveyor port'
            git push origin HEAD:feature/update-8h-live-conveyor-electric-ports
          fi
  verified-native-source-and-real-browser:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Paid original manufacturing, native 250W T02 wiring, flight and source validation
        run: |
          set -euo pipefail
          node --check src/flight.js
          node --check src/physics/logistics-conveyor-live-ui8h.js
          node --check src/physics/conveyor-power-port8h.js
          node --test tests/conveyor-live-port8h.test.cjs
          node --test tests/conveyor-real-placement8h.test.cjs
          node --test tests/conveyor-live8h.test.cjs
          node --test tests/conveyor-native-bridge8h.test.cjs
          node --test tests/conveyor-packets8h.test.cjs
          node --test tests/conveyor-power-port8h.test.cjs
          node --test tests/logistics-offworld-manifest8h.test.cjs
          python3 -m py_compile tests/conveyor-live-port8h-browser.py
          python3 tests/standalone-parity.py
      - name: Install REAL software WebGL2 Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Actual source-owned Engineering original Chromium and truck/ship browser regression
        run: |
          python3 tests/conveyor-live-port8h-browser.py
          python3 tests/conveyor-live8h-browser.py
          python3 tests/logistics-offworld-live8h-browser.py
          python3 tests/logistics-ui8h-browser.py
          python3 tests/truck-custody8b-browser.py
