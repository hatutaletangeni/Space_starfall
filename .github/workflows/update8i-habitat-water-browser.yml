name: STARFALL 8I real habitat water and storage acceptance
on:
  push:
    branches: [fix/update8-release-gates-20261107]
    paths:
      - 'src/physics/habitat-supply8i.js'
      - 'src/physics/habitat-supply-ui8i.js'
      - 'src/flight.js'
      - 'index.html'
      - 'tests/habitat-supply8i*'
      - '.github/workflows/update8i-habitat-water-browser.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/physics/habitat-supply8i.js'
      - 'src/physics/habitat-supply-ui8i.js'
      - 'src/flight.js'
      - 'index.html'
      - 'tests/habitat-supply8i*'
      - '.github/workflows/update8i-habitat-water-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-water-service:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test original 8A mass/power/receipt constraints
        run: |
          node --check src/flight.js
          node --check src/physics/habitat-supply8i.js
          node --check src/physics/habitat-supply-ui8i.js
          node tests/habitat-supply8i.test.cjs
          node tests/update8ij.test.cjs
      - name: Build actual offline playable from editable owner
        run: |
          python tools/build-standalone.py
          python tools/build-mobile-standalone.py
          python tests/standalone-parity.py
      - name: Install actual Chromium browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test physical 8A ship water, T09 state and durable Mission UI in Chromium
        run: python tests/habitat-supply8i-browser.py
