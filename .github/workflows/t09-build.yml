name: T09 standalone build (temporary)
on:
  push:
    branches: [feature/t09-habitat-environment-operations]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Regenerate source identical offline game
        run: |
          python tools/build-standalone.py
          python tests/standalone-parity.py
      - name: Publish built standalone in branch
        run: |
          if ! git diff --quiet -- PLAY-STARFALL.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PLAY-STARFALL.html
            git commit -m "build(t09): rebuild offline game from authoritative habitat sources"
            git push origin HEAD:feature/t09-habitat-environment-operations
          fi
