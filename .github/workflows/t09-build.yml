name: T09 regeneration (temporary)
on:
  push:
    branches: [feature/t09-habitat-environment-operations]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate exact source-identical playable standalone
        run: |
          python tools/build-standalone.py
          python tests/standalone-parity.py
      - name: Commit exact generated output
        run: |
          if ! git diff --quiet -- PLAY-STARFALL.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PLAY-STARFALL.html
            git commit -m "build(t09): regenerate offline bundle after powered airlock safety fix"
            git push origin HEAD:feature/t09-habitat-environment-operations
          fi
