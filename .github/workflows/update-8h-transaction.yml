name: STARFALL 8H atomic stock and energy transaction
on:
  pull_request:
    paths:
      - 'src/physics/logistics-transaction8h.js'
      - 'tests/logistics-transaction8h.test.cjs'
      - '.github/workflows/update-8h-transaction.yml'
  push:
    branches:
      - feature/update-8h-atomic-energy-material-commit
jobs:
  paid-physical-logistics:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and true 8A vehicle custody transaction tests
        run: |
          node --check src/physics/logistics-transaction8h.js
          node --check tests/logistics-transaction8h.test.cjs
          node --test tests/logistics-transaction8h.test.cjs
          node --test tests/logistics-orders8h.test.cjs
          node tests/logistics-energy8h.test.js
          node tests/material-ledger8a.test.cjs
      - name: Do not diverge from the playable standalone source
        run: python3 tests/standalone-parity.py
