name: T06 regenerate standalone (temporary)
on:
  push:
    branches: [feature/t06-autonomous-rover-lifecycle]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile and verify exact offline file
        run: |
          python tools/build-standalone.py
          python tests/standalone-parity.py
      - name: Commit generated standalone
        run: |
          if ! git diff --quiet -- PLAY-STARFALL.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PLAY-STARFALL.html
            git commit -m "build(t06): regenerate offline game from autonomous rover modules"
            git push origin HEAD:feature/t06-autonomous-rover-lifecycle
          fi
