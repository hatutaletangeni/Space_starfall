name: STARFALL 8H powered physical network interlock
on:
  push:
    branches:
      - feature/update-8h-powered-network-interlock
  pull_request:
    paths:
      - 'src/physics/logistics-powered-network8h.js'
      - 'tests/logistics-powered-network8h.test.cjs'
      - '.github/workflows/update-8h-powered-network.yml'
jobs:
  certified-powered-network:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installed original 8A depots, T02 wiring and fail-closed unpowered networks
        run: |
          set -euo pipefail
          node --check src/physics/logistics-powered-network8h.js
          node --test tests/logistics-powered-network8h.test.cjs
          node --test tests/logistics-routes8h.test.cjs
          node --test tests/logistics-pickup8h.test.cjs
          node --test tests/logistics-dropoff8h.test.cjs
      - name: Verify playable standalone still matches original sources
        run: python3 tests/standalone-parity.py
