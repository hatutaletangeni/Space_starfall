name: STARFALL mobile landscape offline edition
on:
  pull_request:
    paths:
      - 'src/mobile/**'
      - 'src/physics/truck-cockpit.js'
      - 'src/physics/truck-cockpit.css'
      - 'index.html'
      - 'tests/truck-cockpit.test.cjs'
      - 'src/flight.js'
      - 'src/starfall-core.js'
      - 'src/physics/physical-inventory8a.js'
      - 'tests/new-expedition8er.test.cjs'
      - 'tests/ship-room-graph8er.test.cjs'
      - 'src/engine.js'
      - 'src/physics/ship-walk8e.js'
      - 'src/physics/ship-hatch8er.js'
      - 'tests/ship-hatch8er.test.cjs'
      - 'tools/build-mobile-standalone.py'
      - 'tests/mobile-standalone-*'
      - 'tests/mobile-vehicle-bay.test.cjs'
      - 'PLAY-STARFALL-MOBILE.html'
      - '.github/workflows/mobile-landscape.yml'
  push:
    paths:
      - 'src/mobile/**'
      - 'src/physics/truck-cockpit.js'
      - 'src/physics/truck-cockpit.css'
      - 'index.html'
      - 'tests/truck-cockpit.test.cjs'
      - 'src/flight.js'
      - 'src/starfall-core.js'
      - 'src/physics/physical-inventory8a.js'
      - 'tests/new-expedition8er.test.cjs'
      - 'tests/ship-room-graph8er.test.cjs'
      - 'src/engine.js'
      - 'src/physics/ship-walk8e.js'
      - 'src/physics/ship-hatch8er.js'
      - 'tests/ship-hatch8er.test.cjs'
      - 'tools/build-mobile-standalone.py'
      - 'tests/mobile-standalone-*'
      - 'tests/mobile-vehicle-bay.test.cjs'
      - 'PLAY-STARFALL-MOBILE.html'
      - '.github/workflows/mobile-landscape.yml'
jobs:
  exact-mobile-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify original standalone parity and mobile editable source parity
        run: |
          python tools/build-standalone.py
          python tools/build-mobile-standalone.py
          python tests/standalone-parity.py
          python tests/mobile-standalone-parity.py
          node tests/mobile-vehicle-bay.test.cjs
          node tests/truck-cockpit.test.cjs
          node tests/new-expedition8er.test.cjs
          node tests/ship-room-graph8er.test.cjs
          node tests/ship-hatch8er.test.cjs
          node tests/update8a.test.cjs
          node tests/cargo-bay8b.test.cjs
      - name: Attach separate offline desktop and mobile builds for QA
        uses: actions/upload-artifact@v4
        with:
          name: starfall-8er-desktop-mobile
          path: |
            PLAY-STARFALL.html
            PLAY-STARFALL-MOBILE.html
          if-no-files-found: error
          retention-days: 7
  mobile-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install test-only Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Real file offline landscape touchscreen test
        run: |
          python tools/build-standalone.py
          python tools/build-mobile-standalone.py
          python tests/mobile-standalone-browser.py

  publish-mobile-standalone:
    needs: [exact-mobile-parity, mobile-chromium]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[mobile-standalone]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild complete offline mobile file from current main sources
        run: |
          python tools/build-standalone.py
          python tools/build-mobile-standalone.py
          python tests/mobile-standalone-parity.py
      - name: Commit standalone if changed (preserve other main commits)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PLAY-STARFALL.html PLAY-STARFALL-MOBILE.html
          if git diff --cached --quiet; then
            echo 'Standalone already synchronized'
            exit 0
          fi
          git commit -m 'build(mobile): refresh compact landscape standalone [mobile-standalone]'
          git pull --rebase origin main
          git push origin HEAD:main

