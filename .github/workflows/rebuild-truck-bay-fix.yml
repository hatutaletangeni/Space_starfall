name: Rebuild and verify Update 8I water + 8J feasibility playables
on:
  push:
    branches: [main, fix/update8-release-gates-20261107]
    paths:
      - '.github/workflows/rebuild-truck-bay-fix.yml'
      - 'index.html'
      - 'src/**'
      - 'tests/**'
      - 'tools/build-standalone.py'
      - 'tools/build-mobile-standalone.py'
      - 'tools/migrate-ui22-browser-tests.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync-playable-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out existing truck fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/update8-release-gates-20261107
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Migrate stale browser nav to actual Mission workspace
        run: python tools/migrate-ui22-browser-tests.py
      - name: Rebuild desktop and landscape mobile standalone
        run: |
          python tools/build-standalone.py
          python tools/build-mobile-standalone.py
      - name: Validate current source, cargo model and offline parity
        run: |
          node --check src/flight.js
          node --check src/physics/habitat-supply8i.js
          node --check src/physics/habitat-supply-ui8i.js
          node --check src/physics/terraform8j.js
          node --check src/physics/terraform-feasibility-ui8j.js
          python tests/standalone-parity.py
          node tests/cargo-bay8b.test.cjs
          node tests/update8a.test.cjs
          node tests/update8ij.test.cjs
          node tests/habitat-supply8i.test.cjs
          node --check src/physics/habitat-oxygen8i.js
          node --check src/physics/habitat-oxygen-ui8i.js
          node tests/habitat-oxygen8i.test.cjs
          node --check src/physics/atmosphere-emission8j.js
          node --check src/physics/atmosphere-emission-ui8j.js
          node tests/atmosphere-emission8j.test.cjs
          node --check src/physics/habitat-scrubber8i.js
          node tests/habitat-scrubber8i.test.cjs
          node --check src/physics/greenhouse8i.js
          node tests/greenhouse8i.test.cjs
      - name: Push validated builds to existing fix branch
        run: |
          git config user.name "starfall-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PLAY-STARFALL.html PLAY-STARFALL-MOBILE.html tests/
          if ! git diff --cached --quiet; then
            git commit -m "build: sync desktop/mobile 8I-8J playable integration"
            git push origin HEAD:fix/update8-release-gates-20261107
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebuilt-truck-bay-playables
          path: |
            PLAY-STARFALL.html
            PLAY-STARFALL-MOBILE.html
