name: Rebuild and verify STARFALL main desktop and mobile playables
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-truck-bay-fix.yml'
      - 'index.html'
      - 'src/**'
      - 'tests/**'
      - 'tools/build-standalone.py'
      - 'tools/build-mobile-standalone.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: starfall-main-playables
  cancel-in-progress: false
jobs:
  sync-playables:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check original truck exit and cargo rules
        run: |
          node --check src/flight.js
          node tests/truck-cockpit.test.cjs
          node tests/factory-material-sources8f.test.cjs
          node tests/expedition-manifest8k.test.cjs
          node tests/cargo-bay8b.test.cjs
          node tests/mobile-vehicle-bay.test.cjs
      - name: Build both playable standalone files
        run: |
          python tools/build-standalone.py
          python tools/build-mobile-standalone.py
      - name: Verify both playable files match source
        run: |
          python tests/standalone-parity.py
          python tests/mobile-standalone-parity.py
      - name: Commit verified playable files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PLAY-STARFALL.html PLAY-STARFALL-MOBILE.html
          if ! git diff --cached --quiet; then
            git commit -m "build: sync desktop and mobile playable with truck cargo exit fix"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starfall-main-playables
          path: |
            PLAY-STARFALL.html
            PLAY-STARFALL-MOBILE.html
