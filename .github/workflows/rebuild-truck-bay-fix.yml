name: Rebuild and verify Update 8 playable integration
on:
  push:
    branches: [fix/update8-release-gates-20261107]
    paths:
      - '.github/workflows/rebuild-truck-bay-fix.yml'
      - 'index.html'
      - 'src/**'
      - 'tests/**'
      - 'tools/build-standalone.py'
      - 'tools/build-mobile-standalone.py'
      - 'tools/migrate-ui22-browser-tests.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  sync-playable-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out existing truck fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/update8-release-gates-20261107
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Migrate stale browser nav to actual Mission workspace
        run: python tools/migrate-ui22-browser-tests.py
      - name: Rebuild desktop and landscape mobile standalone
        run: |
          python tools/build-standalone.py
          python tools/build-mobile-standalone.py
      - name: Validate current source, cargo model and offline parity
        run: |
          node --check src/flight.js
          python tests/standalone-parity.py
          node tests/cargo-bay8b.test.cjs
          node tests/update8a.test.cjs
          node tests/update8ij.test.cjs
          node tests/habitat-supply8i.test.cjs
      - name: Push validated builds to existing fix branch
        run: |
          git config user.name "starfall-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PLAY-STARFALL.html PLAY-STARFALL-MOBILE.html tests/
          if ! git diff --cached --quiet; then
            git commit -m "build: sync desktop and mobile truck boarding fix"
            git push origin HEAD:fix/update8-release-gates-20261107
          fi
      - name: Trigger full strict regression on exactly the committed source and standalones
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/update8-release-gates-20261107
          expected="$(git rev-parse HEAD)"
          actual="$(git rev-parse origin/fix/update8-release-gates-20261107)"
          if [ "$expected" != "$actual" ]; then
            echo "Branch advanced during rebuild ($expected != $actual); a newer rebuild must verify it."
            exit 1
          fi
          # Unlike GITHUB_TOKEN pushes, explicit workflow_dispatch starts a
          # fresh run at the final build commit, not the unsynchronized source.
          gh workflow run engineering-ci.yml --ref fix/update8-release-gates-20261107
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebuilt-truck-bay-playables
          path: |
            PLAY-STARFALL.html
            PLAY-STARFALL-MOBILE.html
